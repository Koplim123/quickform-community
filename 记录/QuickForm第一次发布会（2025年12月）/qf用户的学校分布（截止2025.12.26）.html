        // 初始化统计信息
        document.getElementById('total-schools').textContent = schoolData.length;
        
        // 计算省份数量
        const provinces = [...new Set(schoolData.map(item => item.province))];
        document.getElementById('total-provinces').textContent = provinces.length;
        
        // 计算学校类型数量
        const schoolTypes = [...new Set(schoolData.map(item => item.type))];
        document.getElementById('school-types').textContent = schoolTypes.length;
        
        // 计算城市数量
        const cities = [...new Set(schoolData.map(item => item.city))];
        document.getElementById('total-cities').textContent = cities.length;

        // 填充筛选器选项
        const provinceFilter = document.getElementById('province-filter');
        const typeFilter = document.getElementById('type-filter');
        const cityFilter = document.getElementById('city-filter');
        
        // 按字母顺序排序
        provinces.sort().forEach(province => {
            const option = document.createElement('option');
            option.value = province;
            option.textContent = province;
            provinceFilter.appendChild(option);
        });
        
        schoolTypes.sort().forEach(type => {
            const option = document.createElement('option');
            option.value = type;
            option.textContent = type;
            typeFilter.appendChild(option);
        });
        
        cities.sort().forEach(city => {
            const option = document.createElement('option');
            option.value = city;
            option.textContent = city;
            cityFilter.appendChild(option);
        });

        // 初始化表格数据
        let currentPage = 1;
        const rowsPerPage = 15;
        let filteredData = [...schoolData];

        function renderTable() {
            const tableBody = document.getElementById('table-body');
            tableBody.innerHTML = '';
            
            const startIndex = (currentPage - 1) * rowsPerPage;
            const endIndex = startIndex + rowsPerPage;
            const pageData = filteredData.slice(startIndex, endIndex);
            
            if (pageData.length === 0) {
                const row = document.createElement('tr');
                const cell = document.createElement('td');
                cell.colSpan = 5;
                cell.textContent = '没有找到匹配的学校';
                cell.style.textAlign = 'center';
                cell.style.padding = '40px';
                row.appendChild(cell);
                tableBody.appendChild(row);
            } else {
                pageData.forEach(school => {
                    const row = document.createElement('tr');
                    
                    // 学校名称
                    const nameCell = document.createElement('td');
                    nameCell.textContent = school.name;
                    row.appendChild(nameCell);
                    
                    // 省份
                    const provinceCell = document.createElement('td');
                    provinceCell.textContent = school.province;
                    row.appendChild(provinceCell);
                    
                    // 城市
                    const cityCell = document.createElement('td');
                    cityCell.textContent = school.city;
                    row.appendChild(cityCell);
                    
                    // 区县
                    const districtCell = document.createElement('td');
                    districtCell.textContent = school.district;
                    row.appendChild(districtCell);
                    
                    // 机构类型
                    const typeCell = document.createElement('td');
                    const typeSpan = document.createElement('span');
                    typeSpan.textContent = school.type;
                    typeSpan.className = `school-type type-${school.type}`;
                    typeCell.appendChild(typeSpan);
                    row.appendChild(typeCell);
                    
                    tableBody.appendChild(row);
                });
            }
            
            renderPagination();
        }

        function renderPagination() {
            const totalPages = Math.ceil(filteredData.length / rowsPerPage);
            const pagination = document.getElementById('pagination');
            pagination.innerHTML = '';
            
            if (totalPages <= 1) return;
            
            // 上一页按钮
            const prevButton = document.createElement('button');
            prevButton.innerHTML = '<i class="fas fa-chevron-left"></i>';
            prevButton.disabled = currentPage === 1;
            prevButton.addEventListener('click', () => {
                if (currentPage > 1) {
                    currentPage--;
                    renderTable();
                }
            });
            pagination.appendChild(prevButton);
            
            // 页码按钮
            const maxButtons = 7;
            let startPage = Math.max(1, currentPage - Math.floor(maxButtons / 2));
            let endPage = Math.min(totalPages, startPage + maxButtons - 1);
            
            if (endPage - startPage + 1 < maxButtons) {
                startPage = Math.max(1, endPage - maxButtons + 1);
            }
            
            for (let i = startPage; i <= endPage; i++) {
                const pageButton = document.createElement('button');
                pageButton.textContent = i;
                if (i === currentPage) {
                    pageButton.classList.add('active');
                }
                pageButton.addEventListener('click', () => {
                    currentPage = i;
                    renderTable();
                });
                pagination.appendChild(pageButton);
            }
            
            // 下一页按钮
            const nextButton = document.createElement('button');
            nextButton.innerHTML = '<i class="fas fa-chevron-right"></i>';
            nextButton.disabled = currentPage === totalPages;
            nextButton.addEventListener('click', () => {
                if (currentPage < totalPages) {
                    currentPage++;
                    renderTable();
                }
            });
            pagination.appendChild(nextButton);
            
            // 显示总数
            const totalInfo = document.createElement('div');
            totalInfo.style.marginLeft = '15px';
            totalInfo.style.display = 'flex';
            totalInfo.style.alignItems = 'center';
            totalInfo.innerHTML = `共 ${filteredData.length} 条记录，第 ${currentPage}/${totalPages} 页`;
            pagination.appendChild(totalInfo);
        }

        // 筛选数据
        function filterData() {
            const selectedProvince = provinceFilter.value;
            const selectedType = typeFilter.value;
            const selectedCity = cityFilter.value;
            
            filteredData = schoolData.filter(school => {
                return (!selectedProvince || school.province === selectedProvince) &&
                       (!selectedType || school.type === selectedType) &&
                       (!selectedCity || school.city === selectedCity);
            });
            
            currentPage = 1;
            renderTable();
        }

        // 添加筛选器事件监听
        provinceFilter.addEventListener('change', filterData);
        typeFilter.addEventListener('change', filterData);
        cityFilter.addEventListener('change', filterData);

        // 初始化表格
        renderTable();

        // 初始化ECharts图表
        const mapChart = echarts.init(document.getElementById('map-chart'));
        const pieChart = echarts.init(document.getElementById('pie-chart'));

        // 计算各省份学校数量
        const provinceSchoolCount = {};
        schoolData.forEach(school => {
            // 过滤掉非中国省份的数据（如海外、其他等）
            if (school.province !== "海外" && school.province !== "其他" && school.province !== "澳门特别行政区") {
                // 标准化省份名称，去除"省"、"市"、"自治区"、"特别行政区"等后缀
                let province = school.province;
                // 去除常见的后缀，以匹配ECharts地图中的省份名称
                province = province.replace(/省|市|壮族自治区|回族自治区|维吾尔自治区|自治区|特别行政区/g, '');
                // 特殊处理一些省份名称
                if (province === '内蒙') province = '内蒙古';
                if (province === '黑龙') province = '黑龙江';
                
                provinceSchoolCount[province] = (provinceSchoolCount[province] || 0) + 1;
            }
        });

        // 准备地图数据
        const mapData = Object.keys(provinceSchoolCount).map(province => {
            return {
                name: province,
                value: provinceSchoolCount[province]
            };
        });

        // 地图配置
        const mapOption = {
            title: {
                text: '各省学校数量分布',
                left: 'center',
                textStyle: {
                    fontSize: 18,
                    color: '#2c3e50'
                }
            },
            tooltip: {
                trigger: 'item',
                formatter: function(params) {
                    return `${params.name}<br/>学校数量: ${params.value || 0}`;
                }
            },
            visualMap: {
                left: 'right',
                min: 1,
                max: Math.max(...Object.values(provinceSchoolCount)),
                inRange: {
                    color: ['#e1f5fe', '#0277bd']
                },
                text: ['多', '少'],
                calculable: true,
                textStyle: {
                    color: '#333'
                }
            },
            series: [
                {
                    name: '学校数量',
                    type: 'map',
                    map: 'china',
                    roam: false,
                    zoom: 1.2,
                    label: {
                        show: true,
                        fontSize: 10
                    },
                    emphasis: {
                        label: {
                            color: '#fff',
                            backgroundColor: 'rgba(0,0,0,0.7)',
                            padding: [5, 10],
                            borderRadius: 5
                        },
                        itemStyle: {
                            areaColor: '#43a047'
                        }
                    },
                    data: mapData
                }
            ]
        };

        // 计算学校类型分布
        const typeDistribution = {};
        schoolData.forEach(school => {
            const type = school.type;
            typeDistribution[type] = (typeDistribution[type] || 0) + 1;
        });

        // 饼图数据 - 按数量排序
        const pieData = Object.keys(typeDistribution)
            .map(type => {
                return {
                    name: type,
                    value: typeDistribution[type]
                };
            })
            .sort((a, b) => b.value - a.value);

        // 饼图配置
        const pieOption = {
            title: {
                text: '学校类型分布',
                left: 'center',
                textStyle: {
                    fontSize: 18,
                    color: '#2c3e50'
                }
            },
            tooltip: {
                trigger: 'item',
                formatter: '{a} <br/>{b}: {c} ({d}%)'
            },
            legend: {
                orient: 'vertical',
                left: 'left',
                top: 'middle',
                textStyle: {
                    fontSize: 12
                },
                type: 'scroll'
            },
            series: [
                {
                    name: '学校类型',
                    type: 'pie',
                    radius: ['40%', '70%'],
                    center: ['60%', '50%'],
                    avoidLabelOverlap: false,
                    itemStyle: {
                        borderRadius: 10,
                        borderColor: '#fff',
                        borderWidth: 2
                    },
                    label: {
                        show: false,
                        position: 'center'
                    },
                    emphasis: {
                        label: {
                            show: true,
                            fontSize: '18',
                            fontWeight: 'bold'
                        }
                    },
                    labelLine: {
                        show: false
                    },
                    data: pieData
                }
            ]
        };

        // 渲染图表
        mapChart.setOption(mapOption);
        pieChart.setOption(pieOption);

        // 响应窗口大小变化
        window.addEventListener('resize', function() {
            mapChart.resize();
            pieChart.resize();
        });
    </script>
