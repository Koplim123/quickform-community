{% extends 'base.html' %}

{% block title %}注册 - {{ get_app_name() }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header">
                <h3 class="text-center mb-0">注册账号</h3>
            </div>
            <div class="card-body">
                <form method="POST" action="{{ url_for('auth.register') }}">
                    <div class="mb-4">
                        <label for="username" class="form-label">用户名</label>
                        <input type="text" class="form-control" id="username" name="username" required placeholder="请输入用户名">
                    </div>
                    <div class="mb-4">
                        <label for="password" class="form-label">密码</label>
                        <input type="password" class="form-control" id="password" name="password" required placeholder="请输入密码">
                    </div>
                    <div class="mb-4">
                        <label for="confirm_password" class="form-label">确认密码</label>
                        <input type="password" class="form-control" id="confirm_password" name="confirm_password" required placeholder="请再次输入密码">
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2">注册</button>
                </form>
                <div class="mt-3 text-center">
                    <small>已有账号？<a href="{{ url_for('auth.login') }}">去登录</a></small>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
