<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>头脑风暴问卷</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background-color: white;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 800px;
            overflow: hidden;
            animation: fadeIn 0.8s ease-out;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .header {
            background: linear-gradient(to right, #4b6cb7, #182848);
            color: white;
            padding: 30px 40px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }
        
        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
            line-height: 1.6;
        }
        
        .form-container {
            padding: 40px;
        }
        
        .form-group {
            margin-bottom: 30px;
        }
        
        label {
            display: block;
            font-size: 1.1rem;
            font-weight: 600;
            color: #333;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        input, textarea {
            width: 100%;
            padding: 15px;
            border: 2px solid #e1e5ee;
            border-radius: 10px;
            font-size: 1rem;
            transition: all 0.3s ease;
            background-color: #f9fafc;
        }
        
        input:focus, textarea:focus {
            outline: none;
            border-color: #4b6cb7;
            background-color: white;
            box-shadow: 0 0 0 3px rgba(75, 108, 183, 0.1);
        }
        
        textarea {
            min-height: 150px;
            resize: vertical;
            line-height: 1.6;
        }
        
        .submit-btn {
            background: linear-gradient(to right, #4b6cb7, #182848);
            color: white;
            border: none;
            border-radius: 10px;
            padding: 18px 30px;
            font-size: 1.2rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            letter-spacing: 1px;
        }
        
        .submit-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 7px 15px rgba(75, 108, 183, 0.3);
        }
        
        .submit-btn:active {
            transform: translateY(-1px);
        }
        
        .submit-btn:disabled {
            background: #cccccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        
        .message {
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            text-align: center;
            font-weight: 500;
            display: none;
        }
        
        .success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }
        
        .error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }
        
        .idea-count {
            text-align: right;
            font-size: 0.9rem;
            color: #666;
            margin-top: 5px;
        }
        
        .ideas-container {
            margin-top: 40px;
            border-top: 2px solid #eaeaea;
            padding-top: 30px;
        }
        
        .ideas-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .ideas-header h2 {
            font-size: 1.8rem;
            color: #333;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .refresh-info {
            font-size: 0.9rem;
            color: #666;
            background-color: #f0f4ff;
            padding: 8px 15px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .ideas-list {
            max-height: 400px;
            overflow-y: auto;
            padding-right: 10px;
            border-radius: 10px;
            background-color: #f9fafc;
        }
        
        /* 滚动条样式 */
        .ideas-list::-webkit-scrollbar {
            width: 8px;
        }
        
        .ideas-list::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }
        
        .ideas-list::-webkit-scrollbar-thumb {
            background: #c1c1c1;
            border-radius: 10px;
        }
        
        .ideas-list::-webkit-scrollbar-thumb:hover {
            background: #a8a8a8;
        }
        
        .idea-item {
            background-color: white;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.05);
            border-left: 5px solid #4b6cb7;
            transition: transform 0.3s ease;
            animation: slideIn 0.5s ease-out;
        }
        
        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-10px); }
            to { opacity: 1; transform: translateX(0); }
        }
        
        .idea-item:hover {
            transform: translateX(5px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
        }
        
        .idea-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        
        .idea-name {
            font-weight: 600;
            color: #4b6cb7;
            font-size: 1.1rem;
        }
        
        .idea-time {
            font-size: 0.85rem;
            color: #888;
        }
        
        .idea-content {
            color: #333;
            line-height: 1.6;
            margin-bottom: 10px;
        }
        
        .idea-count-badge {
            display: inline-block;
            background-color: #ff6b6b;
            color: white;
            font-size: 0.8rem;
            font-weight: 600;
            padding: 3px 8px;
            border-radius: 12px;
            margin-left: 8px;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        
        .empty-ideas {
            text-align: center;
            color: #888;
            padding: 40px 20px;
            font-style: italic;
        }
        
        .footer {
            text-align: center;
            padding: 20px;
            color: #666;
            font-size: 0.9rem;
            border-top: 1px solid #eee;
        }
        
        @media (max-width: 768px) {
            .header h1 {
                font-size: 2rem;
            }
            
            .form-container {
                padding: 30px 25px;
            }
            
            .header {
                padding: 25px 30px;
            }
            
            .ideas-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }
            
            .refresh-info {
                align-self: flex-start;
            }
        }
        
        @media (max-width: 480px) {
            body {
                padding: 10px;
            }
            
            .header h1 {
                font-size: 1.8rem;
            }
            
            .form-container {
                padding: 25px 20px;
            }
            
            .idea-item {
                padding: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1><i class="fas fa-lightbulb"></i> 头脑风暴问卷</h1>
            <p>分享您的创意想法，让我们一起碰撞思维的火花！</p>
        </div>
        
        <div class="form-container">
            <form id="brainstormForm">
                <div class="form-group">
                    <label for="name"><i class="fas fa-user"></i> 姓名</label>
                    <input type="text" id="name" name="name" placeholder="请输入您的姓名" required>
                </div>
                
                <div class="form-group">
                    <label for="idea"><i class="fas fa-comment-dots"></i> 想法</label>
                    <textarea id="idea" name="idea" placeholder="请详细描述您的创意想法..." required></textarea>
                    <div class="idea-count">字数: <span id="charCount">0</span></div>
                </div>
                
                <button type="submit" class="submit-btn" id="submitBtn">
                    <i class="fas fa-paper-plane"></i> 提交想法
                </button>
            </form>
            
            <div id="message" class="message"></div>
            
            <!-- 想法展示区域 -->
            <div class="ideas-container">
                <div class="ideas-header">
                    <h2><i class="fas fa-list"></i> 所有想法</h2>
                    <div class="refresh-info">
                        <i class="fas fa-sync-alt"></i>
                        <span>每 <span id="countdown">10</span> 秒自动更新</span>
                    </div>
                </div>
                
                <div class="ideas-list" id="ideasList">
                    <!-- 想法列表将动态加载到这里 -->
                    <div class="empty-ideas">
                        <i class="fas fa-spinner fa-spin"></i> 正在加载想法列表...
                    </div>
                </div>
            </div>
        </div>
        
        <div class="footer">
            <p>您的每一个想法都可能激发新的灵感！</p>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const form = document.getElementById('brainstormForm');
            const submitBtn = document.getElementById('submitBtn');
            const messageDiv = document.getElementById('message');
            const ideaTextarea = document.getElementById('idea');
            const charCount = document.getElementById('charCount');
            const ideasList = document.getElementById('ideasList');
            const countdownElement = document.getElementById('countdown');
            const apiEndpoint = 'http://127.0.0.1:5001/api/yVRAEH5SXBL';
            
            let countdown = 10;
            let updateInterval;
            let allIdeas = [];
            
            // 初始化
            init();
            
            // 初始化函数
            function init() {
                // 实时统计想法字数
                ideaTextarea.addEventListener('input', function() {
                    charCount.textContent = this.value.length;
                });
                
                // 加载想法列表
                loadIdeas();
                
                // 启动自动更新计时器
                startAutoUpdate();
                
                // 表单提交处理
                form.addEventListener('submit', async function(e) {
                    e.preventDefault();
                    await submitForm();
                });
                
                // 添加示例提示
                addPlaceholderHints();
            }
            
            // 加载想法列表
            async function loadIdeas() {
                try {
                    const response = await fetch(apiEndpoint);
                    
                    if (!response.ok) {
                        throw new Error(`获取数据失败: ${response.status}`);
                    }
                    
                    const data = await response.json();
                    allIdeas = data.submissions || [];
                    
                    // 处理并显示想法
                    displayIdeas(allIdeas);
                } catch (error) {
                    console.error('加载想法时出错:', error);
                    ideasList.innerHTML = `<div class="empty-ideas">
                        <i class="fas fa-exclamation-triangle"></i> 加载想法失败: ${error.message}
                    </div>`;
                }
            }
            
            // 显示想法列表
            function displayIdeas(submissions) {
                if (!submissions || submissions.length === 0) {
                    ideasList.innerHTML = `<div class="empty-ideas">
                        <i class="fas fa-lightbulb"></i> 还没有人提交想法，赶快成为第一个吧！
                    </div>`;
                    return;
                }
                
                // 解析数据并统计重复想法
                const ideasMap = new Map();
                
                submissions.forEach(submission => {
                    try {
                        // 解析data字段
                        const dataStr = submission.data.replace(/'/g, '"');
                        const ideaData = JSON.parse(dataStr);
                        const ideaText = ideaData.idea;
                        
                        if (ideasMap.has(ideaText)) {
                            // 如果想法已存在，增加计数
                            const existing = ideasMap.get(ideaText);
                            existing.count++;
                            existing.submissions.push({
                                name: ideaData.name,
                                time: submission.submitted_at
                            });
                        } else {
                            // 新想法，添加到map中
                            ideasMap.set(ideaText, {
                                text: ideaText,
                                count: 1,
                                submissions: [{
                                    name: ideaData.name,
                                    time: submission.submitted_at
                                }]
                            });
                        }
                    } catch (e) {
                        console.error('解析想法数据时出错:', e);
                    }
                });
                
                // 转换为数组并按时间排序（最新的在前面）
                const ideasArray = Array.from(ideasMap.values());
                
                // 按最新提交时间排序
                ideasArray.sort((a, b) => {
                    const timeA = new Date(a.submissions[0].time);
                    const timeB = new Date(b.submissions[0].time);
                    return timeB - timeA;
                });
                
                // 生成HTML
                let ideasHTML = '';
                
                ideasArray.forEach(idea => {
                    const latestSubmission = idea.submissions[0];
                    const countBadge = idea.count > 1 ? 
                        `<span class="idea-count-badge">+${idea.count - 1}</span>` : '';
                    
                    ideasHTML += `
                    <div class="idea-item">
                        <div class="idea-header">
                            <div class="idea-name">
                                <i class="fas fa-user-circle"></i> ${latestSubmission.name}
                                ${countBadge}
                            </div>
                            <div class="idea-time">
                                <i class="far fa-clock"></i> ${formatTime(latestSubmission.time)}
                            </div>
                        </div>
                        <div class="idea-content">${escapeHtml(idea.text)}</div>
                    </div>
                    `;
                });
                
                ideasList.innerHTML = ideasHTML;
                
                // 更新总提交数
                updateTotalCount(submissions.length);
            }
            
            // 格式化时间
            function formatTime(timeString) {
                const date = new Date(timeString);
                const now = new Date();
                const diffMs = now - date;
                const diffMins = Math.floor(diffMs / (1000 * 60));
                const diffHours = Math.floor(diffMs / (1000 * 60 * 60));
                
                if (diffMins < 1) {
                    return '刚刚';
                } else if (diffMins < 60) {
                    return `${diffMins}分钟前`;
                } else if (diffHours < 24) {
                    return `${diffHours}小时前`;
                } else {
                    return date.toLocaleDateString() + ' ' + date.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                }
            }
            
            // 转义HTML，防止XSS攻击
            function escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }
            
            // 更新总提交数显示
            function updateTotalCount(count) {
                const ideasHeader = document.querySelector('.ideas-header h2');
                if (ideasHeader) {
                    ideasHeader.innerHTML = `<i class="fas fa-list"></i> 所有想法 <span style="font-size: 0.9rem; color: #666; margin-left: 5px;">(${count} 条)</span>`;
                }
            }
            
            // 启动自动更新
            function startAutoUpdate() {
                // 先清除之前的定时器
                if (updateInterval) {
                    clearInterval(updateInterval);
                }
                
                // 重置倒计时
                countdown = 10;
                countdownElement.textContent = countdown;
                
                // 设置每秒更新倒计时
                const countdownInterval = setInterval(() => {
                    countdown--;
                    countdownElement.textContent = countdown;
                    
                    if (countdown <= 0) {
                        clearInterval(countdownInterval);
                    }
                }, 1000);
                
                // 每10秒更新一次想法列表
                updateInterval = setInterval(async () => {
                    await loadIdeas();
                    
                    // 重置倒计时
                    countdown = 10;
                    countdownElement.textContent = countdown;
                }, 10000);
            }
            
            // 提交表单
            async function submitForm() {
                // 获取表单数据
                const formData = {
                    name: document.getElementById('name').value.trim(),
                    idea: document.getElementById('idea').value.trim()
                };
                
                // 验证数据
                if (!formData.name || !formData.idea) {
                    showMessage('请填写所有字段！', 'error');
                    return;
                }
                
                // 禁用提交按钮，防止重复提交
                submitBtn.disabled = true;
                submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 提交中...';
                
                try {
                    // 发送POST请求
                    const response = await fetch(apiEndpoint, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify(formData)
                    });
                    
                    // 检查响应状态
                    if (response.ok) {
                        showMessage('提交成功！感谢您的创意想法！', 'success');
                        form.reset();
                        charCount.textContent = '0';
                        
                        // 重新加载想法列表
                        await loadIdeas();
                        
                        // 重置自动更新计时器
                        startAutoUpdate();
                    } else {
                        const errorText = await response.text();
                        throw new Error(`服务器响应错误: ${response.status} - ${errorText}`);
                    }
                } catch (error) {
                    console.error('提交错误:', error);
                    showMessage(`提交失败: ${error.message}`, 'error');
                } finally {
                    // 重新启用提交按钮
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '<i class="fas fa-paper-plane"></i> 提交想法';
                }
            }
            
            // 显示消息函数
            function showMessage(text, type) {
                messageDiv.textContent = text;
                messageDiv.className = `message ${type}`;
                messageDiv.style.display = 'block';
                
                // 3秒后自动隐藏消息（成功消息）
                if (type === 'success') {
                    setTimeout(() => {
                        messageDiv.style.display = 'none';
                    }, 3000);
                }
            }
            
            // 添加输入框提示
            function addPlaceholderHints() {
                const nameInput = document.getElementById('name');
                const ideaInput = document.getElementById('idea');
                
                nameInput.addEventListener('focus', function() {
                    this.placeholder = '例如：张三';
                });
                
                nameInput.addEventListener('blur', function() {
                    this.placeholder = '请输入您的姓名';
                });
                
                ideaInput.addEventListener('focus', function() {
                    this.placeholder = '例如：我们可以开发一个基于AI的创意生成工具，帮助团队在会议中快速产生创新点子...';
                });
                
                ideaInput.addEventListener('blur', function() {
                    this.placeholder = '请详细描述您的创意想法...';
                });
            }
        });
    </script>
</body>
</html>
